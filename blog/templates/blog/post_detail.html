{% extends "blog/base.html" %}
{% block content %}   
    <article class="media content-section">
        <img src="{{ object.author.profile.image.url }}" class="rounded-circle article-img" width="20" height="20" alt="Profile picture">
        <div class="media-body">
            <div class="article-metadata">
            <a class="mr-2" href="{% url 'user-posts' object.author.username %}">{{ object.author }}</a>
            <small class="text-muted">{{ object.date_posted|date:"F d, Y" }}</small>
            {% if object.author == user %}
                <div>
                    <a href="{% url 'post-update' object.pk %}" class="btn btn-outline-secondary btn-sm mt-1">Update</a>
                    <a href="{% url 'post-delete' object.pk %}" class="btn btn-outline-danger btn-sm mt-1">Delete</a>
                </div>
            {% endif %}
            </div>
            <h2 class="article-title">{{ object.title }}</h2>
            <p class="article-content">{{ object.content }}</p>
        </div>
    </article>    
{% endblock content %}
